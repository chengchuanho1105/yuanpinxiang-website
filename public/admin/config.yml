backend:
  name: git-gateway
  branch: main # 你的主要分支名稱，通常是 main 或 master

media_folder: 'public/uploads' # 圖片和其他媒體檔案的儲存路徑，相對於專案根目錄
public_folder: '/uploads' # 媒體檔案在網站上的公開路徑

collections:
  - name: 'posts' # 內容類型名稱 (例如：部落格文章)
    label: '文章' # 在 CMS 介面顯示的標籤
    folder: 'src/content/posts' # 內容檔案儲存的路徑，相對於專案根目錄
    create: true # 允許建立新文章
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}' # 文章檔案名稱的格式
    fields: # 定義內容的欄位
      - { label: '標題', name: 'title', widget: 'string' }
      - { label: '發布日期', name: 'date', widget: 'datetime' }
      - { label: '內文', name: 'body', widget: 'markdown' }
      - { label: '圖片', name: 'image', widget: 'image', required: false }
